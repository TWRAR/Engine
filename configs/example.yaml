# Example config: copy this file per site/task under configs/.
# Open with the GUI's Load Config button, or run: python gui.py

name: "Stux.Group example QA run"

browser:
  channel: default               # default | brave | chrome | edge | firefox
  # channel: "default" auto-detects and launches the OS's registered default
  # browser on Windows (falls back to Brave/bundled Chromium on Linux/macOS).
  # Set channel to a specific browser to force it, or give executable_path
  # directly to bypass detection entirely.
  # executable_path: "C:\\Program Files\\BraveSoftware\\Brave-Browser\\Application\\brave.exe"
  # load_extension: "C:\\path\\to\\unpacked\\extension"   # Chromium-based browsers only
  headless: false
  viewport:
    width: 1440
    height: 900
  # record_video_dir: "output/videos"   # Playwright records a .webm per run;
  # record_video_size defaults to `viewport` above if omitted.

# Persistent Chrome profile dir - keeps you logged in between runs.
# Omitted here: leave this out (or comment out `user_data_dir` below) to use
# TWRAR's own per-config profile folder instead, under the platform's
# per-user app-data directory (%APPDATA%\TWRAR\profiles\<config name>\ on
# Windows), which persists across runs without cluttering wherever this
# config file happens to live. Uncomment to pin it to a specific path
# instead (e.g. to share a profile with another tool):
# user_data_dir: "./.browser-profile"

start_url: "https://stux.group/"

# Pause after every step by default (ms) - handy for watching a run happen,
# or being gentle with a site's rate limits. Any single step can override
# this with its own `delay_after` (and/or `delay_before`), in ms.
default_delay_ms: 200

# Named, reusable step groups. Trigger with {action: run_macro, name: <key>}
# from `steps` or from another macro.
macros:
  login:
    - action: click
      selector: "#login-button"
    - action: fill
      selector: "#username"
      value: "myuser"
    - action: fill
      selector: "#password"
      value: "${env:STUX_PASSWORD}"   # pulled from an environment variable, never hardcoded
    - action: click
      selector: "#submit"

  verify_dashboard_loaded:
    - action: wait_for_selector
      selector: ".dashboard-header"
    - action: assert
      type: visible
      selector: ".dashboard-header"

steps:
  - action: run_macro
    name: login

  - action: run_macro
    name: verify_dashboard_loaded

  - action: click
    selector: "a.nav-pricing"
    delay_after: 1000    # override the default_delay_ms just for this step
    retry:                # flaky click? retry up to 3 times, 500ms apart,
      times: 3             # before this step is considered failed
      delay_ms: 500

  - action: assert
    type: url_contains
    value: "/pricing"
    continue_on_error: true   # log the failure and keep going, rather than
                               # aborting the whole run over one soft check

  # Coordinate click, for the rare element with no stable selector.
  - action: click_coords
    x: 500
    y: 300

  - action: scrape
    selector: ".price-card .price"
    attribute: text
    multiple: true
    save_as: prices

  - action: screenshot
    path: "output/pricing-page.png"

# Omitted here: leave `output` out entirely (or comment out either field
# below) to have TWRAR write results/reports under its own per-config
# app-data folder instead - %APPDATA%\TWRAR\output\<config name>\ on
# Windows. Uncomment to pin them to specific paths instead:
# output:
#   results_file: "output/results.json"
#   # report_dir: a pass/fail report.html + report.json is written here
#   # after every run, with a screenshot auto-captured for any
#   # failed/continued step.
#   report_dir: "output/report"
