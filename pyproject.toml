[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twrar"
dynamic = ["version"]
description = "YAML-driven Playwright automation for QA/regression testing and data scraping, with a desktop step recorder GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "StuxieDev" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "playwright>=1.47",
    "pyyaml>=6.0",
    "PySide6>=6.7",
    "qasync>=0.27",
]

# This project is run from a clone (`python gui.py`) or as a
# PyInstaller-built executable (see .github/workflows/release.yml and
# src/scripts/build_release_files.py, which installs PyInstaller itself -
# no separate extra needed) - it isn't published to PyPI.
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "Pillow>=10.0"]

[tool.setuptools]
packages = ["src", "src.gui", "src.scripts", "src.build"]

[tool.setuptools.dynamic]
version = { file = "VERSION.md" }

[tool.pytest.ini_options]
# Adds the repo root (this file's directory) to sys.path so `import src.xxx`
# resolves the same way it does for gui.py, without needing an editable
# install or a conftest.py sys.path hack.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
