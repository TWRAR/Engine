name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos
          - os: ubuntu-latest
            asset_name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Qt platform dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Build executables
        run: |
          python -m pip install --upgrade pip
          python scripts/build_release_files.py

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p dist_out
          if [ -f "dist/TWRAR.exe" ]; then
            cp "dist/TWRAR.exe" "dist_out/TWRAR-${{ matrix.asset_name }}.exe"
          elif [ -d "dist/TWRAR.app" ]; then
            # --windowed on macOS produces an app bundle, not a flat binary.
            zip -r -q "dist_out/TWRAR-${{ matrix.asset_name }}.zip" "dist/TWRAR.app"
          elif [ -f "dist/TWRAR" ]; then
            cp "dist/TWRAR" "dist_out/TWRAR-${{ matrix.asset_name }}"
          fi
          ls -la dist_out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.asset_name }}
          path: dist_out/*

  steam-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TWRAR_Steam_Assets.zip
        run: |
          mkdir -p dist_out
          cd assets/steam
          zip -r ../../dist_out/TWRAR_Steam_Assets.zip .

      - name: Publish to steam_assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan steam_assets
          git reset --hard
          cp dist_out/TWRAR_Steam_Assets.zip .
          git add TWRAR_Steam_Assets.zip
          git commit -m "Update Steam assets (${{ github.ref_name }})"
          git push origin steam_assets --force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-assets
          path: dist_out/TWRAR_Steam_Assets.zip

  release:
    needs: [build, steam-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
